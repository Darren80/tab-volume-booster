<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- No background: the tile is transparent. -->
  <!-- Speaker cone: white fill with a thin dark outline so it stays visible on
       both light and dark toolbars. -->
  <path d="M18 40 H32 L52 24 V72 L32 56 H18 Z" fill="#ffffff"
        stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Three sound waves, green, growing outward. -->
  <g fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round">
    <path d="M60 40 Q68 48 60 56"/>
    <path d="M70 33 Q83 48 70 63"/>
    <path d="M80 26 Q98 48 80 70"/>
  </g>
</svg>
