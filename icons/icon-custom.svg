<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- ======================================================================
       Custom-preset toolbar icon = the normal speaker + waves, with a big
       rounded gradient badge (no stroke) and a white "C" over it. Shown when
       the EQ has been hand-tuned away from any named preset ("custom").

       TO RESIZE THE BADGE: change ONLY the scale(...) number on the <g> line
       near the bottom. It grows the rectangle AND the letter together. Do NOT
       touch the rect's width/height or the text's font-size — those are the
       badge's fixed internal proportions; scale() multiplies the whole thing.
       To MOVE the badge: change translate(x y) on that same <g> line.
       (Grid is 96x96; x=0 is left, y=0 is TOP.)

       NOTE: the badge is a single letter here, so its font-size is a touch
       larger than the two-letter VB/BB badges so the "C" fills the same rect.
       ====================================================================== -->
  <defs>
    <linearGradient id="c-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#29d3ee"/>
    </linearGradient>
  </defs>

  <!-- Existing artwork (unchanged from icon.svg): speaker + green waves. -->
  <path d="M5 39 H27 L53 5 V91 L27 57 H5 Z" fill="#ffffff"
        stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#22c55e" stroke-width="9" stroke-linecap="round">
    <path d="M61 34 Q73 48 61 62"/>
    <path d="M75 14 Q97 48 75 82"/>
  </g>

  <!-- Gradient badge + label, drawn last so they sit in front of everything
       above. The whole badge lives in this group with TWO simple knobs:
         • translate(48 66) = WHERE the badge's centre sits (move it here)
         • scale(1.3)       = HOW BIG the badge is  (one number: 1.2 = 20% bigger)
       Inside the group everything is drawn around (0,0), so the rect's corner is
       -halfWidth,-halfHeight and the text sits at 0,0 (dead centre). -->
  <g transform="translate(48 66) scale(1.3)">
    <rect x="-32" y="-23" width="64" height="46" rx="13" fill="url(#c-grad)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, Helvetica, sans-serif" font-weight="700"
          font-size="44" fill="#ffffff">C</text>
  </g>
</svg>
